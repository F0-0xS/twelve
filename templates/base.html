<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>{% block title %}Twelve{% end %}</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0d0d0d;
      --bg2:      #161616;
      --bg3:      #1f1f1f;
      --border:   #2a2a2a;
      --text:     #f0f0f0;
      --muted:    #666;
      --accent:   #e8d5b0;
      --accent2:  #c4a97d;
      --danger:   #ef4444;
      --success:  #22c55e;
      --open:     #f59e0b;
      --radius:   12px;
      --radius-sm: 8px;
      --shadow:   0 4px 24px rgba(0,0,0,.5);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.5;
      overscroll-behavior: none;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { display: block; max-width: 100%; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; }

    /* ── Layout ────────────────────────────────────────────── */
    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── Nav ───────────────────────────────────────────────── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .nav-back {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: .85rem;
    }
    .nav-back:hover { color: var(--text); text-decoration: none; }

    /* ── Cards ─────────────────────────────────────────────── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card + .card { margin-top: 12px; }

    /* ── Buttons ───────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: .95rem;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
      text-decoration: none !important;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: var(--accent);
      color: #0d0d0d;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-ghost {
      background: var(--bg3);
      color: var(--text);
    }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }

    /* ── Inputs ────────────────────────────────────────────── */
    .input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 13px 16px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .input::placeholder { color: var(--muted); }
    .input:focus { border-color: var(--accent2); }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .label {
      font-size: .8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 600;
    }

    /* ── Alerts ────────────────────────────────────────────── */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: .9rem;
    }
    .alert-error { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
    .alert-info  { background: rgba(232,213,176,.08); border: 1px solid rgba(232,213,176,.2); color: var(--accent); }

    /* ── Badges ────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .badge-upcoming { background: rgba(255,255,255,.06); color: var(--muted); }
    .badge-open     { background: rgba(245,158,11,.15); color: var(--open); }
    .badge-sent     { background: rgba(34,197,94,.12); color: var(--success); }
    .badge-missed   { background: rgba(239,68,68,.12); color: #fca5a5; }
    .badge-past     { background: rgba(255,255,255,.04); color: #444; }

    /* ── Avatars / chips ───────────────────────────────────── */
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 700;
      color: var(--accent);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .participant-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 12px 5px 5px;
      font-size: .85rem;
    }

    /* ── Section headers ───────────────────────────────────── */
    .section-title {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 12px;
    }

    /* ── Spacing helpers ───────────────────────────────────── */
    .mt8  { margin-top: 8px; }
    .mt12 { margin-top: 12px; }
    .mt16 { margin-top: 16px; }
    .mt24 { margin-top: 24px; }
    .mt32 { margin-top: 32px; }
    .gap8  { gap: 8px; }
    .gap12 { gap: 12px; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    .text-muted { color: var(--muted); }
    .text-sm { font-size: .85rem; }
    .text-xs { font-size: .75rem; }
    .text-center { text-align: center; }
    .fw600 { font-weight: 600; }
    .fw700 { font-weight: 700; }

    /* ── Spinner ───────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    /* ── Scrollbar ─────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    {% block extra_styles %}{% end %}
  </style>
</head>
<body class="page">
  {% block body %}{% end %}

  <script>
    // Global utils
    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ Copié !';
        btn.style.background = 'rgba(34,197,94,.2)';
        btn.style.borderColor = 'rgba(34,197,94,.4)';
        setTimeout(() => {
          btn.textContent = orig;
          btn.style.background = '';
          btn.style.borderColor = '';
        }, 2000);
      }).catch(() => {
        prompt('Copie ce lien :', text);
      });
    }

    {% block extra_scripts %}{% end %}
  </script>
</body>
</html>
